<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        padding: 13px 20px;
        font-size: 15px;
        border-radius: 10px;
        cursor: pointer;
      }

      .chat-input {
        font-size: 15px;
        padding: 12px 15px;
        border-width: 1px;
        border-radius: 10px;
        margin-right: 10px;
        border-style: solid;
        flex-grow: 1;
      }

      .chat-input-container {
        display: flex;
      }

      .app-container {
        max-width: 600px;
        margin: auto;
        padding: 12px 0;
      }

      .welcome-message {
        color: rgb(120, 120, 120);
        text-align: center;
        margin-top: 0;
}
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="react-basics.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      const DEFAULT_TEXT_INPUT_STATE = '';
      const SENDER_USER = 'user';
      const SENDER_ROBOT = 'robot';
      
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState(DEFAULT_TEXT_INPUT_STATE);
        const [isLoading, setIsLoading] = React.useState(false);

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          setIsLoading(true);

          const newChatMessages = [
            ...chatMessages, 
            {
              message: inputText,
              sender: SENDER_USER,
              id: crypto.randomUUID()
            }
          ];

          setInputText(DEFAULT_TEXT_INPUT_STATE);
          setChatMessages(newChatMessages);

          setChatMessages([
            ...newChatMessages, 
            {
              message: 'Loading...',
              sender: SENDER_ROBOT,
              id: crypto.randomUUID()
            }
          ]);

          const response = await Chatbot.getResponseAsync(inputText);

          setChatMessages([
            ...newChatMessages, 
            {
              message: response,
              sender: SENDER_ROBOT,
              id: crypto.randomUUID()
            }
          ]);

          setIsLoading(false);
        }

        const handleKeyDown = (event) => {
          if ((event.key === 'Enter') && inputText.trim() !== '') {
            !isLoading && sendMessage();
          }

          if (event.key === 'Escape') {
            setInputText(DEFAULT_TEXT_INPUT_STATE);
          }
        };

        return (
          <div
            className="chat-input-container"
          >
            <input 
              placeholder="Send a message to Chatbot" 
              size="30"
              onChange={saveInputText}
              onKeyDown={handleKeyDown}
              value={inputText}
              className="chat-input"
            /> 
            <button
              onClick={(isLoading || !inputText.trim()) ? () => {} : sendMessage}
              className="send-button"
            >Send</button>  
          </div>
        );
      }

      function ChatMessage({message, sender}) {
        return(
          <div>
            {sender === SENDER_ROBOT && (
              <img src="assets/robot.png" width="50" />
            )}
            {message}
            {sender === SENDER_USER && (
              <img src="assets/user.png" width="50" />
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        return(
          <>
            {chatMessages.map((chatMessage, index) => {
              return (
                <ChatMessage
                  message={chatMessage.message} 
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);

        return (
          <div
            className="app-container"
          >
            <ChatInput 
              chatMessages={chatMessages} 
              setChatMessages={setChatMessages}
            /> 
            <ChatMessages 
              chatMessages={chatMessages}
            />

            {!chatMessages.length && (
                <p
                  className="welcome-message"
                >
                  Welcome to the chatbot project! Send a message using the textbox above.
                </p>
              )}
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
